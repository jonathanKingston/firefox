<html>
  <head>
    <title>Upgrade Insecure Requests: link click to top-frame (no upgrade expected)</title>
  </head>
  <body>
    <!--
    Tests that a link click with target="_top" from an iframe is NOT upgraded
    when the link URL does not match any origin in the upgrade insecure
    navigations set.

    This is a bit of a hack. UPGRADE doesn't upgrade the port number. So if the
    url is upgraded, the url becomes invalid (https over the http port). The
    expected behavior is that the url is not upgraded and the page loads.
    -->
    <iframe
      sandbox="allow-scripts allow-top-navigation"
      src="https://{{domains[www]}}:{{ports[https][0]}}/upgrade-insecure-requests/link-upgrade/resources/click-link-to-top.sub.html?url=http://{{domains[www]}}:{{ports[http][1]}}/upgrade-insecure-requests/link-upgrade/resources/post-message-to-opener.sub.html%3Fmessage=iframe-top-navigation-link-no-upgrade"
    ></iframe>
  </body>
</html>
